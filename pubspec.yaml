name: customized_country_phone_picker
description: Flutter phone input with country picker (sheet/dialog), EN/AR names,
  paste-to-detect, optional strict validation, themed search.
version: 0.5.0
homepage: https://github.com/MustafaYounis27/customized_country_phone_picker
repository: https://github.com/MustafaYounis27/customized_country_phone_picker
issue_tracker: https://github.com/MustafaYounis27/customized_country_phone_picker/issues
topics:
  - phone
  - country-picker
  - country-phone-picker
  - input
  - widget

# Shown on pub.dev (carousel + right-rail preview). Paths are relative to package root.
screenshots:
  - description: 'Country phone input with searchable country picker (sheet/dialog)'
    path: example/images/hero_light.png
  - description: 'Themed picker search and country list'
    path: example/images/themed_search_open_dark.png

environment:
  sdk: ^3.7.0
  flutter: ">=3.7.0"

dependencies:
  flutter:
    sdk: flutter
  phone_numbers_parser: ^9.0.22

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
